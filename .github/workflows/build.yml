name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: ./scripts/linux/deps.sh

      - name: Local CI check (build + tests)
        run: ./scripts/linux/ci-local.sh
