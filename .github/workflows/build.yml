name: Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: ./scripts/linux/deps.sh

      - name: Build Aze
        run: ./scripts/linux/build.sh --release

      - name: Run tests
        run: ./scripts/linux/run.sh --release -- run-tests
